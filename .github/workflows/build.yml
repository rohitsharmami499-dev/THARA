
name: Build THARA APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No project ZIP found in repository root."
            ls -la
            exit 1
          fi

          echo "Project archive: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Searching for Gradle project..."
          find extracted -name settings.gradle.kts -type f

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="$(find extracted -name settings.gradle.kts -type f -print -quit)"

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::settings.gradle.kts was not found in the ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project directory: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts was not found."
            exit 1
          fi

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")

          # Remove existing Android compileOptions blocks.
          source = re.sub(
              r'(?m)^[ \t]*compileOptions[ \t]*\{[^}]*\}[ \t]*\n?',
              '',
              source
          )

          # Remove existing kotlinOptions blocks.
          source = re.sub(
              r'(?m)^[ \t]*kotlinOptions[ \t]*\{[^}]*\}[ \t]*\n?',
              '',
              source
          )

          # Set both Java and Kotlin compilation targets to Java 17.
          android_block = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          if not re.search(r'\bandroid\s*\{', source):
              raise SystemExit("ERROR: android { } block not found.")

          source = re.sub(
              r'\bandroid\s*\{',
              lambda match: android_block,
              source,
              count=1
          )

          path.write_text(source, encoding="utf-8")
          print("Updated Java and Kotlin targets to JVM 17.")
          print(f"Updated file: {path}")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "::error::Build finished, but no debug APK was found."
            exit 1
          fi

          echo "APK successfully created: $APK_FILE"
          ls -lh "$APK_FILE"

      - name: Upload THARA APK
        uses: actions/upload-artifact@v4
        with:
          name: THARA-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
